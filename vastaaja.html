<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Vastaaja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .box {
      max-width: 420px;
      padding: 30px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #111;
    }

    button {
      margin-top: 20px;
      padding: 14px;
      width: 100%;
      font-size: 18px;
      background: #fff;
      border: none;
      cursor: pointer;
    }

    audio {
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Vastaaja</h2>
  <p>Paina kuullaksesi viestin.</p>

  <button onclick="playMessage()">Kuuntele vastaaja</button>

  <div id="player"></div>
</div>


<script>
  function playMessage() {
    const playerDiv = document.getElementById("player");
    playerDiv.innerHTML = "";

    const audio = document.createElement("audio");
    audio.src = "vastaaja.wav";
    audio.controls = true;
    audio.preload = "auto";

    playerDiv.appendChild(audio);

    // 🔑 TÄRKEÄT RIVIT MOBIILILLE
    audio.load();
    audio.play().catch(err => {
      console.log("Play estetty:", err);
    });
  }
</script>


</body>
</html>
