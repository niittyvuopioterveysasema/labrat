<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Vastaaja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;

    .box {
      max-width: 420px;
      padding: 30px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #111;

      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Vastaaja</h2>
  <p>Paina toistoa kuullaksesi viestin.</p>

  <audio controls playsinline preload="auto">
    <source src="satutässähei.wav" type="audio/wav">
    Selaimesi ei tue äänentoistoa.
  </audio>
</div>

</body>
</html>
